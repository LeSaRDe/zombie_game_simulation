[build-system]
requires = ["setuptools>=78.1", "wheel>=0.45"]
build-backend = "setuptools.build_meta"

[project]
name = "zombie-sim"
version = "0.1.0"
description = "Ontology-driven continuous-time zombie simulation and research workspace"
readme = "README.md"
requires-python = ">=3.12"
authors = [{name = "Zombie simulation contributors"}]
dependencies = []

[project.scripts]
zombie-sim = "zombie_sim.cli:main"

[project.optional-dependencies]
gui = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "websockets>=15,<17"]
learning = ["numpy>=2.2,<3", "torch>=2.5,<3", "gymnasium>=1.1,<2", "pettingzoo>=1.24,<2"]
analysis = ["pyarrow>=18,<27", "matplotlib>=3.9,<4"]
ontology = ["rdflib>=7.1,<8", "pyshacl>=0.30,<1"]
dev = ["build>=1.2,<2"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["zombie_sim*"]

[tool.setuptools.package-data]
zombie_sim = ["spec/*.md", "spec/formal_v0.1/*.ttl", "spec/formal_v0.1/*.owl", "spec/formal_v0.1/*.json", "static/*", "static/**/*"]
